spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: smart-farm-bot
  datasource:
    url: jdbc:h2:mem:smartfarm;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-flash-lite-latest
  base-url: https://generativelanguage.googleapis.com/v1beta
