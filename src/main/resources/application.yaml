server:
  # Elastic Beanstalk(Java SE 플랫폼)은 PORT 환경변수로 리스닝 포트를 지정한다.
  # 로컬 개발 시 PORT 미설정이면 기존처럼 8080 사용.
  port: ${PORT:8080}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: smart-farm-bot
  datasource:
    url: jdbc:h2:mem:smartfarm;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-flash-latest
  base-url: https://generativelanguage.googleapis.com/v1beta
