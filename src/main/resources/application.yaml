spring:
  application:
    name: smart-farm-bot
  datasource:
    url: jdbc:h2:mem:smartfarm;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
