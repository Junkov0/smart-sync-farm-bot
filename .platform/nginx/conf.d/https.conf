server {
    listen 443 ssl;
    server_name smartfarm-bot.p-e.kr;

    ssl_certificate     /etc/letsencrypt/live/smartfarm-bot.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartfarm-bot.p-e.kr/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/sensor/stream는 SSE(장시간 유지되는 스트림)라 버퍼링/타임아웃 기본값이면 끊긴다.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
